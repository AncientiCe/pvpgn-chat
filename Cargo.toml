[package]
name = "bnetchat"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "PvPGN chat-gateway protocol, session, chat state and saved accounts"

[dependencies]
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.92"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "linux-native"] }

[workspace]
members = [".", "gpui-app"]
# Plain `cargo run` / `cargo build` / `cargo test` cover the library and the app.
default-members = [".", "gpui-app"]
resolver = "2"
