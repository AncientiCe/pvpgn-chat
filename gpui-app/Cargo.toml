[package]
name = "pvpgn-chat"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
description = "Desktop chat client for PvPGN servers"

[dependencies]
bnetchat = { path = ".." }
gpui-kit = "=0.11.0"
smol = "2"
log = "0.4"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
