[package]
name = "bnetchat-gpui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prototype GPUI front end for bnetchat"

[dependencies]
bnetchat = { path = ".." }
gpui-kit = "=0.11.0"
smol = "2"
tracing = "0.1"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
